[package]
name = "json-signer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap        = { version = "4.6", features = ["derive"] }
rsa         = { version = "0.9", features = ["sha2"] }
sha2        = "0.10"
rand        = "0.8"
signature   = "2"
spki        = "0.7"
serde_json  = "1"
base64      = "0.22"
chrono      = { version = "0.4" }
anyhow      = "1"
serde       = "1"
pem         = "3.0"
json-canon  = "0.1"

[profile.release]
lto = true
opt-level = "z"  # Optimize for size.
strip = true  # Automatically strip symbols from the binary.
codegen-units = 1
panic = "abort"


